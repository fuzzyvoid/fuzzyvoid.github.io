<!-- Alpine data/events are for opening/closing menu in mobile view -->
<header
	class="site-header"
	x-data="{ open: false }"
	@keydown.escape="open = false"
>
	<div class="site-header__inner">
		<div class="survivor-btns">
			<a class="btn survivor-btn" data-survivor="ders" href="ders.html">
				<img
					class="base"
					src="assets/media/img/btns/UI_Ders_Head.png"
					alt="Ders Icon Button"
					width="64"
					height="64"
				>
				<img
					class="hover"
					src="assets/media/img/btns/UI_Ders_Head_Hurt.png"
					alt="Ders Icon Button"
					width="64"
					height="64"
				>
				<img class="when-page-active"
					src="assets/media/img/btns/UI_Ders_Head_Heal.png"
					alt="Ders Icon Button"
					width="64"
					height="64"
				>
			</a>
			<a class="btn survivor-btn" data-survivor="cirne" href="cirne.html">
				<img
					class="base"
					src="assets/media/img/btns/UI_Cirne_Head.png"
					alt="Cirne Icon Button"
					width="64"
					height="64"
				>
				<img
					class="hover"
					src="assets/media/img/btns/UI_Cirne_Head_Heal.png"
					alt="Cirne Icon Button"
					width="64"
					height="64"
				>
				<img
					class="when-page-active"
					src="assets/media/img/btns/UI_Cirne_Head_Heal.png"
					alt="Cirne Icon Button"
					width="64"
					height="64"
				>
			</a>
			<a class="btn survivor-btn" data-survivor="trale" href="trale.html">
				<img
					class="base"
					src="assets/media/img/btns/UI_Trale_Head.png"
					alt="Trale Icon Button"
					width="64"
					height="64"
				>
				<img
					class="hover"
					src="assets/media/img/btns/UI_Trale_Head_Hurt.png"
					alt="Trale Icon Button"
					width="64"
					height="64"
				>
				<img class="when-page-active"
					src="assets/media/img/btns/UI_Trale_Head_Heal.png"
					alt="Trale Icon Button"
					width="64"
					height="64"
				>
			</a>
		</div>

		<div class="site-logo">
			<a href="index.html">
				<img
					src="assets/media/img/logo-clean.png"
					alt="Revertices Logo"
				>
			</a>
		</div>

		<!-- Shown below 48rem instead of in the menu, keeping CTA visible -->
		<a
			class="btn btn--primary header-cta"
			href="https://store.steampowered.com/app/3236560/Revertices/"
		>Wishlist</a>

		<button
			class="nav-toggle"
			type="button"
			aria-controls="primary-nav"
			:aria-expanded="open ? 'true' : 'false'"
			@click="open = !open"
		>
			<span class="visually-hidden">Menu</span>
			<img src="assets/media/svg/burger-menu.svg" width="22" height="22"/>
		</button>

		<!-- data-open is always a string to persist the attribute. CSS hides this when BOTH .js is present and the viewport is narrow, so menu is still usable with no JS on mobile -->
		<ul class="nav"
			id="primary-nav"
			:data-open="open ? 'true' : 'false'"
			@click="open = false"
		>
			<li>
				<a
					class="nav__link with-icon"
					href="https://fuzzyvoidco.itch.io/revertices"
				>Itch</a>
			</li>
			<li>
				<a
					class="nav__link with-icon cirne"
					href="https://store.steampowered.com/app/3236560/Revertices/"
				>Steam</a>
			</li>
			<li>
				<a
					class="nav__link with-icon trale"
					data-nav="about"
					href="about.html"
				>About</a>
			</li>

			<li class="nav__mobile">
				<a class="nav__link nav__survivor-link" data-nav="ders" href="ders.html">
					<span class="nav__head" aria-hidden="true">
						<img class="base" src="assets/media/img/btns/UI_Ders_Head.png" alt="" width="64" height="64">
						<img class="hover" src="assets/media/img/btns/UI_Ders_Head_Hurt.png" alt="" width="64" height="64">
					</span>
					Ders
				</a>
			</li>
			<li class="nav__mobile">
				<a class="nav__link nav__survivor-link" data-nav="cirne" href="cirne.html">
					<span class="nav__head" aria-hidden="true">
						<img class="base" src="assets/media/img/btns/UI_Cirne_Head.png" alt="" width="64" height="64">
						<img class="hover" src="assets/media/img/btns/UI_Cirne_Head_Heal.png" alt="" width="64" height="64">
					</span>
					Cirne
				</a>
			</li>
			<li class="nav__mobile">
				<a class="nav__link nav__survivor-link" data-nav="trale" href="trale.html">
					<span class="nav__head" aria-hidden="true">
						<img class="base" src="assets/media/img/btns/UI_Trale_Head.png" alt="" width="64" height="64">
						<img class="hover" src="assets/media/img/btns/UI_Trale_Head_Hurt.png" alt="" width="64" height="64">
					</span>
					Trale
				</a>
			</li>

			<li class="nav__cta">
				<a
					class="btn btn--primary"
					href="https://store.steampowered.com/app/3236560/Revertices/"
				>Wishlist</a>
			</li>
		</ul>
	</div>
</header>
